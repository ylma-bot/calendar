<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Petit calendrier</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calendar">
    <header class="calendar-header">
      <h1 id="month-title">Calendrier</h1>
    </header>

    <section class="weekdays">
      <div>L</div>
      <div>M</div>
      <div>M</div>
      <div>J</div>
      <div>V</div>
      <div>S</div>
      <div>D</div>
    </section>

    <section id="calendar-days" class="calendar-days">
      <!-- Les jours seront ajoutés avec JavaScript -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
